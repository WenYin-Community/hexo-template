title: 玟茵开源社区知识库
subtitle: 'WenYin Open Source Wiki'
avatar: '/images/icon/wenyin-logo.png'
favicon: '/images/icon/favicon.ico'
description: 'Open source community for developing open software.'
keywords: [开源, 知识库, 技术文档, WenYin, Open Source]
author: WenYin Open Source Community
language:
  - zh-CN
  - en
  - zh-TW
timezone: 'Asia/Shanghai'
url: https://wiki.wenyinos.com
canonical:
  originalHost: # 主站点域名主机，例如 xaoxuu.com
  officialHosts: # 官方主机列表，每行一个，例如 xaoxuu.vercel.app
    - localhost
    - wenyinos.github.io
root: '/'
permalink: ':year/:month/:day/:title/'
permalink_defaults: null
pretty_urls:
  trailing_index: true
  trailing_html: true
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: ':lang'
skip_render: null
new_post_name: ':title.md'
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''
index_generator:
  path: ''
  per_page: 10
  order_by: '-date'
default_category: uncategorized
category_map: null
tag_map: null
meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date
pagination_dir: page
include: null
exclude: null
ignore: null
theme: stellar
deploy:
  type: git
  repo: https://github.com/wenyinos/wenyinos.github.io.git
  branch: main
