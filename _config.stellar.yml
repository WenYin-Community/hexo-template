logo:
  avatar: '/images/icon/wenyin-logo.png'
  subtitle: 'Open Source Community|WenYin Wiki' # 文字 1 | 文字 2 (鼠标放上去会切换到文字 2)

article:
  type: tech # tech/story
  auto_excerpt: 100
  # npm i hexo-related-popular-posts
  related_posts:
    enable: true
    title: 您可能感兴趣
open_graph:
  enable: true
  twitter_id: # for open_graph meta

style:
  prefers_theme: light
  font-size:
    root: 16px
    body: 17px
    code: 85%
    codeblock: 0.8125rem
  font-family:
    body: '"Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
    code: '"JetBrains Mono", "SF Mono", "Fira Code", Consolas, monospace'
    codeblock: '"JetBrains Mono", "SF Mono", "Fira Code", Consolas, monospace'
  border-radius:
    card-l: 12px
    card: 6px
    card-s: 6px
    bar: 8px
    image-l: 6px
    image: 6px
    image-s: 6px
  color:
    theme: '#6f42c1'
    accent: '#4a2c82'
    link: '#6f42c1'

inject:
  head:
    - '<link rel="preconnect" href="https://fonts.googleapis.com">'
    - '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
    - '<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">'
    - '<link rel="stylesheet" href="/css/custom.css">'
  script:
    - |
      <button class="theme-toggle" type="button" aria-label="切换夜间模式" aria-pressed="false">
        <span class="theme-toggle-icon" aria-hidden="true"></span>
        <span class="theme-toggle-text">夜间</span>
      </button>
      <script>
        (() => {
          const button = document.querySelector('.theme-toggle');
          if (!button) return;
          const label = button.querySelector('.theme-toggle-text');
          const media = window.matchMedia('(prefers-color-scheme: dark)');
          const currentMode = () => document.documentElement.getAttribute('data-theme') || (media.matches ? 'dark' : 'light');
          const syncButton = () => {
            const dark = currentMode() === 'dark';
            button.dataset.mode = dark ? 'dark' : 'light';
            button.setAttribute('aria-pressed', String(dark));
            button.setAttribute('aria-label', dark ? '切换到日间模式' : '切换到夜间模式');
            if (label) label.textContent = dark ? '日间' : '夜间';
          };
          const setTheme = (theme) => {
            document.documentElement.setAttribute('data-theme', theme);
            window.localStorage.setItem('Stellar.theme', theme);
            if (window.utils && utils.dark) {
              utils.dark.mode = theme;
              utils.dark.method?.toggle?.start?.();
            }
            syncButton();
          };
          button.addEventListener('click', () => setTheme(currentMode() === 'dark' ? 'light' : 'dark'));
          media.addEventListener?.('change', syncButton);
          syncButton();
        })();
      </script>

footer:
  social:
    github:
      icon: '<img src="https://gcore.jsdelivr.net/gh/cdn-x/placeholder/social/08a41b181ce68.svg"/>'
      url: https://github.com/wenyinos
    unsplash:
      icon: '<img src="https://gcore.jsdelivr.net/gh/cdn-x/placeholder/social/3616429.svg"/>'
      url: https://github.com/WenYin-Community

site_tree:
